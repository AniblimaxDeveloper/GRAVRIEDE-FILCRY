name: Build Android APK
on:
  push:
    branches: [ "main", "utama" ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.3
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Export Templates
        run: |
          mkdir -v -p ~/.local/share/godot/export_templates/
          mv /root/.local/share/godot/export_templates/4.3.stable ~/.local/share/godot/export_templates/4.3.stable

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
          build-tools: '33.0.2'

      - name: Install Android Build Template & Export APK
        run: |
          mkdir -p build
          godot --headless --verbose --import --install-android-build-template --export-debug "Android" build/GRAVRIEDE-FILCRY.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GRAVRIEDE-FILCRY-APK
          path: build/*.apk
