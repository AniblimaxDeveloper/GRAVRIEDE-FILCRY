name: Build Android APK

on:
  push:
    branches: [ "main", "utama" ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-33 build-tools;33.0.2'

      - name: Setup Godot 4.3 & Export Templates
        uses: chickensoft-games/setup-godot@v1
        with:
          version: 4.3.0
          use-dotnet: false
          include-templates: true

      - name: Configure Godot Editor Settings
        run: |
          mkdir -p ~/.config/godot
          echo '[gd_resource type="EditorSettings" format=3]' > ~/.config/godot/editor_settings-4.3.tres
          echo '[resource]' >> ~/.config/godot/editor_settings-4.3.tres
          echo 'export/android/java_sdk_path = "'$JAVA_HOME'"' >> ~/.config/godot/editor_settings-4.3.tres
          echo 'export/android/android_sdk_path = "'$ANDROID_HOME'"' >> ~/.config/godot/editor_settings-4.3.tres

      - name: Generate Debug Keystore
        run: |
          keytool -keyalg RSA -genkeypair -alias androiddebugkey -keypass android -keystore debug.keystore -storepass android -dname "CN=Android Debug,O=Android,C=US" -validity 9999 -deststoretype pkcs12

      - name: Export APK
        run: |
          mkdir -p build
          godot --headless --verbose --export-debug "Android" build/GRAVRIEDE-FILCRY.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GRAVRIEDE-FILCRY-APK
          path: build/*.apk
