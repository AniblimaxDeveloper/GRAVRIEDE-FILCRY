name: Build Android APK

on:
  push:
    branches: [ "main", "utama" ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Godot
        uses: chickensoft-games/setup-godot@v1
        with:
          version: 4.3.0
          use-dotnet: false
          include-templates: true

      - name: Export APK
        run: |
          mkdir -p build
          # Perintah ini akan mem-build game menjadi file APK
          godot --headless --export-release "Android" build/GRAVRIEDE-FILCRY.apk || echo "Konfigurasi export belum ada di project.godot"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GRAVRIEDE-FILCRY-APK
          path: build/*.apk
