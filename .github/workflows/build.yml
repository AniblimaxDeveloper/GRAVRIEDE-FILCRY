name: Build Android APK
on: [push]
jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Setup Godot
        uses: chickensoft-games/setup-godot@v1
        with:
          version: 4.3.0
          include-templates: true
      - name: Export APK
        run: |
          mkdir -p build
          godot --headless --export-debug "Android" build/GRAVRIEDE-FILCRY.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GRAVRIEDE-FILCRY-APK
          path: build/*.apk
