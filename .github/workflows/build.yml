name: Build Android APK

on:
  push:
    branches: [ "main", "utama" ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.3
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Export Templates
        run: |
          mkdir -v -p ~/.local/share/godot/export_templates/
          mv /root/.local/share/godot/export_templates/4.3.stable ~/.local/share/godot/export_templates/4.3.stable

      - name: Export APK
        run: |
          mkdir -p build
          # Perintah ekspor menggunakan Godot di dalam Docker
          godot --headless --export-debug "Android" build/GRAVRIEDE-FILCRY.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GRAVRIEDE-FILCRY-APK
          path: build/*.apk
